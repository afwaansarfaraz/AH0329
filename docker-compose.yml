services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: winddesk-backend
    ports:
      - "8008:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: winddesk-frontend
    ports:
      - "3008:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
